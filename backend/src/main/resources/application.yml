spring:
  application:
    name: vote-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vote}
    username: ${DATABASE_USERNAME:vote}
    password: ${DATABASE_PASSWORD:vote}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: never
  max-http-request-header-size: 8KB
app:
  visitor-hmac-secret: ${VISITOR_HMAC_SECRET:change-this-development-secret-before-production}
